name: Production
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Never cancel an active mutation. Pending runs always check out and test main's
# current head when they obtain this lock, so obsolete queued SHAs are not applied.
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate the actual desired revision
        run: |
          bash tools/check.sh
          bash tools/container-check.sh
      - name: Prepare private inputs
        env:
          PRIVATE_CONFIG: ${{ secrets.PRIVATE_CONFIG }}
          RUNTIME_SECRETS: ${{ secrets.RUNTIME_SECRETS }}
        run: python3 tools/ci-private.py
      - name: Azure workload identity
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false
      - name: Reconcile merged configuration
        if: github.event_name == 'push'
        run: ./codex-infra apply --private "$RUNNER_TEMP/codex-private"
      - name: Verify drift and security
        run: ./codex-infra verify --private "$RUNNER_TEMP/codex-private"
      - name: Remove ephemeral private inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/codex-private"
