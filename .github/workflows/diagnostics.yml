name: Production diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnostics.yml
      - operations/diagnostics.py
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Prepare private inputs
        env:
          PRIVATE_CONFIG: ${{ secrets.PRIVATE_CONFIG }}
          RUNTIME_SECRETS: ${{ secrets.RUNTIME_SECRETS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: python3 tools/ci-private.py
      - name: Azure workload identity
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read operation states
        run: python3 operations/diagnostics.py "$RUNNER_TEMP/codex-private"
      - name: Remove ephemeral private inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/codex-private"
